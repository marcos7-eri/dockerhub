name: Despliegue en docker hub

on:
  push:
    branches: ["main"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v6

      - name: Log in to Dker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Build
        uses: docker/setup-buildx-action@v3
        
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:latest
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:${{ github.sha }}

            
